# Локально и в production: одинаковые версии PostgreSQL 16, Redis 7, Nginx 1.27.
x-app-environment: &app-env
  PORT: 8080
  HOST: 0.0.0.0
  NODE_ENV: production
  SERVICE_NAME: parking-backend
  DATABASE_URL: postgres://parking:parking_secret@db:5432/parking
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-local-compose-secret}
  SESSION_NAME: parking.sid
  SESSION_TTL_MS: 86400000
  SESSION_COOKIE_SECURE: "false"
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  MIN_BOOKING_HOURS: 1
  LOG_LEVEL: info
  RELEASE_VERSION: ${RELEASE_VERSION:-local}
  RELEASE_ENVIRONMENT: ${RELEASE_ENVIRONMENT:-local}
  TRUST_PROXY: "true"
  SHUTDOWN_GRACE_MS: 15000
  SHUTDOWN_MIN_DRAIN_MS: 500

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking_secret
      POSTGRES_DB: parking
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  app-1:
    build: .
    image: ${APP_IMAGE:-parking-app:local}
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    stop_grace_period: 20s
    depends_on: &app-depends
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &app-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  app-2:
    image: ${APP_IMAGE:-parking-app:local}
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    stop_grace_period: 20s
    depends_on: *app-depends
    healthcheck: *app-healthcheck

  app-3:
    image: ${APP_IMAGE:-parking-app:local}
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    stop_grace_period: 20s
    depends_on: *app-depends
    healthcheck: *app-healthcheck

  migrate:
    image: ${APP_IMAGE:-parking-app:local}
    build: .
    environment:
      <<: *app-env
      INSTANCE_ID: migrate
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:
